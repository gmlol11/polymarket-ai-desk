services:
  postgres:
    image: postgres:16
    container_name: polymarket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: polymarket_ai_desk
      POSTGRES_USER: polymarket_user
      POSTGRES_PASSWORD: polymarket_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: polymarket_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
